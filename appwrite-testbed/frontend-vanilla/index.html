<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Appwrite + Backend Ping (Vanilla)</title>
  <link rel="stylesheet" href="./style.css"/>
  <script defer src="./config.js"></script>
  <script defer type="module" src="./app.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>Ping Testbed</h1>
        <p class="muted" id="meta"></p>
      </div>
    </header>

    <section class="card">
      <h2>Appwrite Ping</h2>
      <p class="muted">Calls <code>/v1/ping</code> with <code>X-Appwrite-Project</code>.</p>
      <button class="btn primary" id="btnAppwrite">Ping Appwrite</button>
      <pre class="out" id="outAppwrite"></pre>
    </section>

    <section class="card">
      <h2>Backend Ping</h2>
      <p class="muted">Calls your Flask/FastAPI <code>/ping</code>.</p>
      <button class="btn" id="btnApi">Ping Backend API</button>
      <pre class="out" id="outApi"></pre>
    </section>

    <section class="card">
      <h2>Echo (POST JSON)</h2>
      <p class="muted">Sends JSON to <code>/echo</code>.</p>
      <button class="btn" id="btnEcho">POST /echo</button>
      <pre class="out" id="outEcho"></pre>
    </section>
  </main>
</body>
</html>
